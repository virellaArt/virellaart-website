name: Apply Made-to-Order Schema Patch

on:
  push:
    branches:
      - agent/product-schema-made-to-order
    paths:
      - scripts/patch-made-to-order-schema.mjs
      - .github/workflows/patch-made-to-order-schema.yml

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[schema-normalized]') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/product-schema-made-to-order
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Apply schema patch
        run: node scripts/patch-made-to-order-schema.mjs

      - name: Commit ProductTemplate update
        shell: bash
        run: |
          if git diff --quiet -- src/components/ProductTemplate.astro; then
            echo "No schema changes required."
            exit 0
          fi
          git config user.name "VIRELLAART SEO Automation"
          git config user.email "info@virellaart.com"
          git add -- src/components/ProductTemplate.astro
          git diff --cached --check
          git commit -m "seo: align made-to-order product availability schema [schema-normalized]"
          git push origin HEAD:agent/product-schema-made-to-order
