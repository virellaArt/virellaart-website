name: Apply Social Attribution and Market Lead Patch

on:
  push:
    branches:
      - agent/social-attribution-market-qualification
    paths:
      - scripts/apply-social-market-growth-patch.mjs
      - .github/workflows/apply-social-market-growth-patch.yml

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[growth-patched]') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/social-attribution-market-qualification
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Apply growth patch
        run: node scripts/apply-social-market-growth-patch.mjs

      - name: Commit source updates
        shell: bash
        run: |
          if git diff --quiet -- src/layouts/BaseLayout.astro src/components/MarketPage.astro; then
            echo "No source updates required."
            exit 0
          fi
          git config user.name "VIRELLAART Growth Automation"
          git config user.email "info@virellaart.com"
          git add -- src/layouts/BaseLayout.astro src/components/MarketPage.astro
          git diff --cached --check
          git commit -m "growth: preserve social attribution and qualify market leads [growth-patched]"
          git push origin HEAD:agent/social-attribution-market-qualification
