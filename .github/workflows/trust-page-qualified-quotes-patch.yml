name: Apply trust page qualified quote patch

on:
  push:
    branches:
      - agent/trust-page-qualified-quotes

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/trust-page-qualified-quotes

      - name: Apply patch
        run: node scripts/apply-trust-page-qualified-quotes.mjs

      - name: Commit generated page changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/pages/about.astro src/pages/manufacturing.astro
          git diff --cached --check
          git commit -m "feat: qualify trust-page WhatsApp requests"
          git push origin HEAD:agent/trust-page-qualified-quotes
