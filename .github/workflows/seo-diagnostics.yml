name: SEO Diagnostics

on:
  push:
    branches:
      - agent/seo-diagnostics

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and capture diagnostics
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee seo-build.log

      - name: Upload diagnostic log
        uses: actions/upload-artifact@v4
        with:
          name: seo-build-diagnostics
          path: seo-build.log
          if-no-files-found: error
          retention-days: 1
