name: Normalize Product SEO Source

on:
  push:
    branches:
      - agent/seo-intent-internal-social
    paths:
      - scripts/normalize-product-seo-source.mjs
      - .github/workflows/normalize-product-seo.yml

permissions:
  contents: write

jobs:
  normalize:
    if: ${{ !contains(github.event.head_commit.message, '[seo-normalized]') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/seo-intent-internal-social
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Normalize ProductTemplate SEO
        run: node scripts/normalize-product-seo-source.mjs

      - name: Commit normalized source
        shell: bash
        run: |
          if git diff --quiet -- src/components/ProductTemplate.astro; then
            echo "No normalization changes required."
            exit 0
          fi
          git config user.name "VIRELLAART SEO Automation"
          git config user.email "info@virellaart.com"
          git add -- src/components/ProductTemplate.astro
          git diff --cached --check
          git commit -m "seo: normalize product titles and social metadata [seo-normalized]"
          git push origin HEAD:agent/seo-intent-internal-social
