name: Apply Riva Inclusion Patch

on:
  push:
    branches:
      - agent/category-intent-riva-conversion
    paths:
      - scripts/patch-riva-included.mjs
      - .github/workflows/patch-riva-included.yml

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[riva-included]') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/category-intent-riva-conversion
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Apply patch
        run: node scripts/patch-riva-included.mjs

      - name: Commit ProductTemplate update
        shell: bash
        run: |
          if git diff --quiet -- src/components/ProductTemplate.astro; then
            echo "No Riva inclusion change required."
            exit 0
          fi
          git config user.name "VIRELLAART Conversion Automation"
          git config user.email "info@virellaart.com"
          git add -- src/components/ProductTemplate.astro
          git diff --cached --check
          git commit -m "fix: show Riva full-set included pieces [riva-included]"
          git push origin HEAD:agent/category-intent-riva-conversion
